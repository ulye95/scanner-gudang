<script>


/* =====================================================
   URL APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyqo2l0CmoyO0Sxvu6r53WSgy8XvuVEyMixog8s9k566qr7vMOrODJ4gHdCpnChHqVY/exec";



/* =====================================================
   NAVIGASI
   ===================================================== */

function showPage(page) {


  const dashboardPage =
    document
      .getElementById("dashboardPage");


  const scanPage =
    document
      .getElementById("scanPage");


  const dashboardNav =
    document
      .getElementById("dashboardNav");


  const scanNav =
    document
      .getElementById("scanNav");


  if (
    page === "dashboard"
  ) {

    dashboardPage
      .classList
      .add("active");


    scanPage
      .classList
      .remove("active");


    dashboardNav
      .classList
      .add("active");


    scanNav
      .classList
      .remove("active");


    loadDashboard();

  }


  else {

    dashboardPage
      .classList
      .remove("active");


    scanPage
      .classList
      .add("active");


    dashboardNav
      .classList
      .remove("active");


    scanNav
      .classList
      .add("active");

  }

}



/* =====================================================
   FORMAT RUPIAH
   ===================================================== */

function formatRupiah(
  angka
) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(
    Number(angka) || 0
  );

}



/* =====================================================
   LOAD DASHBOARD
   ===================================================== */

function loadDashboard() {

  document.getElementById("totalProduk").innerHTML = "…";
  document.getElementById("totalStok").innerHTML = "…";
  document.getElementById("nilaiStokHPP").innerHTML = "…";
  document.getElementById("barangMasuk").innerHTML = "…";
  document.getElementById("barangKeluar").innerHTML = "…";
  document.getElementById("totalPenjualan").innerHTML = "…";
  document.getElementById("labaKotor").innerHTML = "…";

  const callbackName =
    "dashboardCallback_" + Date.now();

  window[callbackName] = function(data) {

    try {

      if (!data.success) {
        throw new Error(
          data.message ||
          "Gagal mengambil data dashboard."
        );
      }

      document.getElementById("totalProduk").innerHTML =
        data.totalProduk;

      document.getElementById("totalStok").innerHTML =
        data.totalStok;

      document.getElementById("nilaiStokHPP").innerHTML =
        formatRupiah(data.nilaiStokHPP);

      document.getElementById("barangMasuk").innerHTML =
        data.barangMasuk;

      document.getElementById("barangKeluar").innerHTML =
        data.barangKeluar;

      document.getElementById("totalPenjualan").innerHTML =
        formatRupiah(data.totalPenjualan);

      document.getElementById("labaKotor").innerHTML =
        formatRupiah(data.labaKotor);

      tampilkanTransaksi(
        data.transaksiTerbaru || []
      );

    } catch (error) {

      console.error(error);

      document.getElementById(
        "transactionContainer"
      ).innerHTML =
        "<div class='status error'>" +
        "Gagal mengambil data dashboard.<br><br>" +
        error.message +
        "</div>";
    }

    // Hapus callback setelah selesai
    delete window[callbackName];

    // Hapus script
    const script =
      document.getElementById(callbackName);

    if (script) {
      script.remove();
    }
  };

  const script =
    document.createElement("script");

  script.id = callbackName;

  script.src =
    API_URL +
    "?action=dashboard&callback=" +
    callbackName;

  script.onerror = function() {

    document.getElementById(
      "transactionContainer"
    ).innerHTML =
      "<div class='status error'>" +
      "Gagal terhubung ke server Dashboard." +
      "</div>";

    delete window[callbackName];

    script.remove();
  };

  document.body.appendChild(script);
}


/* =====================================================
   TAMPILKAN TRANSAKSI
   ===================================================== */

function tampilkanTransaksi(
  transaksi
) {


  const container =
    document
      .getElementById(
        "transactionContainer"
      );


  if (
    !transaksi ||
    transaksi.length === 0
  ) {

    container.innerHTML =
      "Belum ada transaksi.";

    return;

  }


  let html =

    "<div style='overflow-x:auto'>" +

    "<table class='transaction-table'>" +

    "<thead>" +

    "<tr>" +

    "<th>Waktu</th>" +

    "<th>Barang</th>" +

    "<th>Jenis</th>" +

    "<th>Qty</th>" +

    "<th>User</th>" +

    "</tr>" +

    "</thead>" +

    "<tbody>";


  transaksi.forEach(
    function(item) {


      const tanggal =
        item.timestamp
          ? new Date(
              item.timestamp
            ).toLocaleString(
              "id-ID"
            )
          : "-";


      const jenis =
        String(
          item.jenis || ""
        ).toUpperCase();


      const badgeClass =
        jenis === "MASUK"
          ? "badge-masuk"
          : "badge-keluar";


      const qty =
        Math.abs(
          Number(
            item.qty
          ) || 0
        );


      html +=

        "<tr>" +

        "<td>" +
        tanggal +
        "</td>" +

        "<td>" +

        "<b>" +
        item.kodeBarang +
        "</b><br>" +

        item.namaBarang +

        "</td>" +

        "<td>" +

        "<span class='badge " +
        badgeClass +
        "'>" +

        jenis +

        "</span>" +

        "</td>" +

        "<td>" +
        qty +
        "</td>" +

        "<td>" +
        item.user +
        "</td>" +

        "</tr>";

    }
  );


  html +=

    "</tbody>" +

    "</table>" +

    "</div>";


  container.innerHTML =
    html;

}



/* =====================================================
   SCANNER VARIABLES
   ===================================================== */

let scanner = null;

let scannerAktif = false;

let sedangProses = false;

let lastCode = "";

let lastScanTime = 0;



/* =====================================================
   AUDIO
   ===================================================== */

let audioContext = null;


function playBeep() {


  try {


    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const now =
      audioContext.currentTime;


    const oscillator =
      audioContext.createOscillator();


    const gainNode =
      audioContext.createGain();


    oscillator.type =
      "square";


    oscillator.frequency.setValueAtTime(
      1400,
      now
    );


    gainNode.gain.setValueAtTime(
      0.8,
      now
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.01,
      now + 0.20
    );


    oscillator.connect(
      gainNode
    );


    gainNode.connect(
      audioContext.destination
    );


    oscillator.start(now);


    oscillator.stop(
      now + 0.20
    );


    const oscillator2 =
      audioContext.createOscillator();


    const gainNode2 =
      audioContext.createGain();


    oscillator2.type =
      "square";


    oscillator2.frequency.setValueAtTime(
      1800,
      now + 0.22
    );


    gainNode2.gain.setValueAtTime(
      0.8,
      now + 0.22
    );


    gainNode2.gain.exponentialRampToValueAtTime(
      0.01,
      now + 0.42
    );


    oscillator2.connect(
      gainNode2
    );


    gainNode2.connect(
      audioContext.destination
    );


    oscillator2.start(
      now + 0.22
    );


    oscillator2.stop(
      now + 0.42
    );


  }

  catch(error) {

    console.log(
      "Beep:",
      error
    );

  }

}



/* =====================================================
   VIBRASI
   ===================================================== */

function vibrate() {


  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [100, 50, 100]
      );

    }

  }

  catch(error) {

    console.log(error);

  }

}



/* =====================================================
   CHANNEL
   ===================================================== */

function updateChannelVisibility() {


  const jenis =
    document
      .getElementById("jenis")
      .value;


  const container =
    document
      .getElementById(
        "channelContainer"
      );


  if (
    jenis === "MASUK"
  ) {

    container.style.display =
      "none";

  }

  else {

    container.style.display =
      "block";

  }

}



/* =====================================================
   START SCANNER
   ===================================================== */

async function startScanner() {


  if (
    scannerAktif ||
    sedangProses
  ) {

    return;

  }


  const button =
    document
      .getElementById(
        "scanButton"
      );


  button.disabled =
    true;


  setStatus(
    "⏳ Membuka kamera...",
    "info"
  );


  try {


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {


      const label =
        (
          cameras[i].label ||
          ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    document
      .getElementById("reader")
      .style.display =
      "block";


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess

    );


    scannerAktif =
      true;


    button.disabled =
      false;


    setStatus(
      "📷 Arahkan kamera ke QR Code.",
      "info"
    );


  }

  catch(error) {


    console.error(error);


    scannerAktif =
      false;


    button.disabled =
      false;


    document
      .getElementById("reader")
      .style.display =
      "none";


    setStatus(
      "Kamera gagal dibuka: " +
      error.message,
      "error"
    );

  }

}



/* =====================================================
   QR SUCCESS
   ===================================================== */

async function onScanSuccess(
  decodedText
) {


  if (
    sedangProses
  ) {

    return;

  }


  const now =
    Date.now();


  if (
    decodedText === lastCode &&
    now - lastScanTime < 2000
  ) {

    return;

  }


  lastCode =
    decodedText;


  lastScanTime =
    now;


  playBeep();

  vibrate();


  sedangProses =
    true;


  await stopScanner();


  await processTransaction(
    decodedText.trim()
  );

}



/* =====================================================
   STOP SCANNER
   ===================================================== */

async function stopScanner() {


  if (
    scanner &&
    scannerAktif
  ) {


    try {

      await scanner.stop();

      await scanner.clear();

    }

    catch(error) {

      console.log(
        "Scanner stop:",
        error
      );

    }

  }


  scanner =
    null;


  scannerAktif =
    false;


  document
    .getElementById("reader")
    .style.display =
    "none";

}



/* =====================================================
   TRANSAKSI
   ===================================================== */

async function processTransaction(
  kodeBarang
) {


  setStatus(
    "⏳ Memproses " +
    kodeBarang +
    "...",
    "info"
  );


  const user =
    document
      .getElementById("user")
      .value
      .trim() ||
      "Admin";


  const jenis =
    document
      .getElementById("jenis")
      .value;


  let channel =
    "-";


  if (
    jenis === "KELUAR"
  ) {

    channel =
      document
        .getElementById(
          "channel"
        )
        .value;

  }


  const data = {

    kodeBarang:
      kodeBarang,

    jenis:
      jenis,

    channel:
      channel,

    user:
      user

  };


  try {


    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          body:
            JSON.stringify(data)

        }

      );


    const result =
      await response.json();


    if (
      result.success
    ) {

      showSuccess(
        result
      );


      /* Update dashboard */

      loadDashboard();

    }

    else {

      showError(
        result.message
      );

    }


  }

  catch(error) {


    showError(

      "Tidak dapat terhubung ke server.<br><br>" +
      error.message

    );

  }


  finally {


    sedangProses =
      false;


    const button =
      document
        .getElementById(
          "scanButton"
        );


    button.disabled =
      false;


    button.innerHTML =
      "📷 SCAN";

  }

}

   ===================================================== */

function showError(
  message
) {


  setStatus(
    "✕ Transaksi gagal.",
    "error"
  );


  document
    .getElementById("result")
    .innerHTML =

      "<div class='last-title'>" +

/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
  message,
  type
) {


  const element =
    document
      .getElementById(
        "status"
      );


  element.innerHTML =
    message;


  element.className =
    "status " +
    type;

}
