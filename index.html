  </div>

<script>


/* =====================================================
   URL APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyqo2l0CmoyO0Sxvu6r53WSgy8XvuVEyMixog8s9k566qr7vMOrODJ4gHdCpnChHqVY/exec";



/* =====================================================
   VARIABLE SCANNER
   ===================================================== */

let scanner = null;

let scannerAktif = false;

let sedangProses = false;

let lastCode = "";

let lastScanTime = 0;


/* =====================================================
   AUDIO BEEP
   ===================================================== */

let audioContext = null;


function playBeep() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }


    const now =
      audioContext.currentTime;


    /* BEEP PERTAMA */

    const oscillator =
      audioContext.createOscillator();

    const gainNode =
      audioContext.createGain();


    oscillator.type =
      "square";


    oscillator.frequency.setValueAtTime(
      1400,
      now
    );


    gainNode.gain.setValueAtTime(
      0.8,
      now
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.01,
      now + 0.20
    );


    oscillator.connect(gainNode);

    gainNode.connect(
      audioContext.destination
    );


    oscillator.start(now);

    oscillator.stop(
      now + 0.20
    );


    /* BEEP KEDUA */

    const oscillator2 =
      audioContext.createOscillator();

    const gainNode2 =
      audioContext.createGain();


    oscillator2.type =
      "square";


    oscillator2.frequency.setValueAtTime(
      1800,
      now + 0.22
    );


    gainNode2.gain.setValueAtTime(
      0.8,
      now + 0.22
    );


    gainNode2.gain.exponentialRampToValueAtTime(
      0.01,
      now + 0.42
    );


    oscillator2.connect(gainNode2);

    gainNode2.connect(
      audioContext.destination
    );


    oscillator2.start(
      now + 0.22
    );


    oscillator2.stop(
      now + 0.42
    );


  }

  catch(error) {

    console.log(
      "Beep tidak dapat diputar:",
      error
    );

  }

}



/* =====================================================
   VIBRASI
   ===================================================== */

function vibrate() {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [100, 50, 100]
      );

    }

  }

  catch(error) {

    console.log(error);

  }

}



/* =====================================================
   TAMPILKAN / SEMBUNYIKAN CHANNEL
   ===================================================== */

function updateChannelVisibility() {

  const jenis =
    document
      .getElementById("jenis")
      .value;


  const channelContainer =
    document
      .getElementById("channelContainer");


  if (
    jenis === "MASUK"
  ) {

    channelContainer.style.display =
      "none";

  }

  else {

    channelContainer.style.display =
      "block";

  }

}



/* =====================================================
   MULAI SCANNER
   ===================================================== */

async function startScanner() {


  if (scannerAktif) {

    return;

  }


  if (sedangProses) {

    return;

  }


  const button =
    document
      .getElementById("scanButton");


  button.disabled =
    true;


  setStatus(
    "⏳ Membuka kamera...",
    "info"
  );


  try {


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    /* Cari kamera belakang */

    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (
          cameras[i].label || ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    document
      .getElementById("reader")
      .style.display =
      "block";


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess

    );


    scannerAktif =
      true;


    button.disabled =
      false;


    setStatus(
      "📷 Arahkan kamera ke QR Code.",
      "info"
    );


  }

  catch(error) {


    console.error(error);


    scannerAktif =
      false;


    button.disabled =
      false;


    document
      .getElementById("reader")
      .style.display =
      "none";


    setStatus(
      "Kamera gagal dibuka: " +
      error.message,
      "error"
    );

  }

}



/* =====================================================
   QR BERHASIL TERBACA
   ===================================================== */

async function onScanSuccess(
  decodedText
) {


  if (sedangProses) {

    return;

  }


  const now =
    Date.now();


  /* Anti double scan */

  if (
    decodedText === lastCode &&
    now - lastScanTime < 2000
  ) {

    return;

  }


  lastCode =
    decodedText;


  lastScanTime =
    now;


  /* BEEP */

  playBeep();

  vibrate();


  /* Kunci proses */

  sedangProses =
    true;


  /* Matikan scanner */

  await stopScanner();


  /* Proses transaksi */

  await processTransaction(
    decodedText.trim()
  );


}



/* =====================================================
   STOP SCANNER OTOMATIS
   ===================================================== */

async function stopScanner() {


  if (
    scanner &&
    scannerAktif
  ) {

    try {

      await scanner.stop();

      await scanner.clear();

    }

    catch(error) {

      console.log(
        "Scanner stop:",
        error
      );

    }

  }


  scanner =
    null;


  scannerAktif =
    false;


  document
    .getElementById("reader")
    .style.display =
    "none";


}



/* =====================================================
   PROSES TRANSAKSI
   ===================================================== */

async function processTransaction(
  kodeBarang
) {


  setStatus(
    "⏳ Memproses " +
    kodeBarang +
    "...",
    "info"
  );


  const user =
    document
      .getElementById("user")
      .value
      .trim() ||
      "Admin";


  const jenis =
    document
      .getElementById("jenis")
      .value;


  let channel =
    "-";


  if (
    jenis === "KELUAR"
  ) {

    channel =
      document
        .getElementById("channel")
        .value;

  }


  const data = {

    kodeBarang:
      kodeBarang,

    jenis:
      jenis,

    channel:
      channel,

    user:
      user

  };


  try {


    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          body:
            JSON.stringify(data)

        }

      );


    const result =
      await response.json();


    if (
      result.success
    ) {

      showSuccess(
        result
      );

    }

    else {

      showError(
        result.message
      );

    }


  }

  catch(error) {


    showError(

      "Tidak dapat terhubung ke server.<br><br>" +
      error.message

    );

  }


  finally {


    sedangProses =
      false;


    /* Kembali ke kondisi SCAN */

    const button =
      document
        .getElementById("scanButton");


    button.disabled =
      false;


    button.innerHTML =
      "📷 SCAN";


  }

}



/* =====================================================
   TRANSAKSI BERHASIL
   ===================================================== */

function showSuccess(
  result
) {


  setStatus(
    "✓ Transaksi berhasil disimpan.",
    "success"
  );


  document
    .getElementById("result")
    .innerHTML =

      "<div class='last-title'>" +

      "✓ TRANSAKSI BERHASIL" +

      "</div>" +

      "Kode Barang: " +

      result.kodeBarang +

      "<br>" +

      "Nama Barang: " +

      result.namaBarang +

      "<br>" +

      "Jenis: " +

      result.jenis +

      "<br>" +

      "Channel: " +

      result.channel +

      "<br>" +

      "User: " +

      result.user +

      "<br><br>" +

      "<b>STOK SEKARANG</b>" +

      "<div class='stock'>" +

      result.stokSesudah +

      "</div>";

}



/* =====================================================
   TRANSAKSI GAGAL
   ===================================================== */

function showError(
  message
) {


  setStatus(
    "✕ Transaksi gagal.",
    "error"
  );


  document
    .getElementById("result")
    .innerHTML =

      "<div class='last-title'>" +

      "✕ TRANSAKSI GAGAL" +

      "</div>" +

      message;

}



/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
  message,
  type
) {


  const element =
    document
      .getElementById("status");


  element.innerHTML =
    message;


  element.className =
    "status " + type;

}



/* =====================================================
   SAAT HALAMAN DIBUKA
   ===================================================== */

updateChannelVisibility();


</script>
